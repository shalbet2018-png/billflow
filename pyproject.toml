[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "billflow"
version = "0.2.0"
description = "Configurable monthly invoicing and ledger automation for property managers and small businesses"
requires-python = ">=3.9"
dependencies = ["openpyxl>=3.1", "python-docx>=1.1", "pyyaml>=6", "reportlab>=4", "cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
billflow = "billflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

